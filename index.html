<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天龙人</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e9f6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="天龙人">
  <link rel="apple-touch-icon" href="icon-192-v2.png">

  <link rel="stylesheet" href="styles.css?v=20260822">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
  <script>
    try {
      var t = localStorage.getItem('tl-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="icon-192-v2.png" alt="" class="brand-icon"></div>
        <div>
          <div class="brand-name">天龙人</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="overview"><span class="nico">🏠</span>总览</button>
        <button class="nav-item" data-page="calendar"><span class="nico">📅</span>日历</button>
        <button class="nav-item" data-page="weight"><span class="nico">🐖</span>体重</button>
        <button class="nav-item" data-page="punch"><span class="nico">🕐</span>打卡</button>
        <button class="nav-item" data-page="water"><span class="nico">🥃</span>喝水</button>
        <button class="nav-item" data-page="nutrition"><span class="nico">🍣</span>餐食</button>
        <button class="nav-item" data-page="fitness"><span class="nico">🤺</span>训练</button>
        <button class="nav-item" data-page="finance"><span class="nico">💵</span>财务</button>
        <button class="nav-item" data-page="settings"><span class="nico">⚙️</span>设置</button>
      </nav>
      <div class="side-foot">v4.1</div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <div class="flex" style="align-items:center;gap:10px;">
          <button class="menu-btn" id="menuBtn" aria-label="菜单">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="greeting">
            <h1 id="greetTitle">早上好</h1>
            <p id="greetSub">掌控每一天</p>
          </div>
        </div>
        <div class="topbar-right">
          <button class="theme-btn" id="themeBtn" title="切换主题" aria-label="切换主题"></button>
          <div class="pill"><span class="avatar" id="avatarBtn">我</span></div>
        </div>
      </header>

      <div class="content">
        <div class="page active" id="page-overview"><div id="body-overview"></div></div>
        <div class="page" id="page-calendar"><div id="body-calendar"></div></div>
        <div class="page" id="page-weight"><div id="body-weight"></div></div>
        <div class="page" id="page-punch"><div id="body-punch"></div></div>
        <div class="page" id="page-water"><div id="body-water"></div></div>
        <div class="page" id="page-nutrition"><div id="body-nutrition"></div></div>
        <div class="page" id="page-fitness"><div id="body-fitness"></div></div>
        <div class="page" id="page-finance"><div id="body-finance"></div></div>
        <div class="page" id="page-settings"><div id="body-settings"></div></div>
      </div>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head">
          <div class="modal-title" id="modalTitle">标题</div>
          <button class="modal-close" id="modalClose" aria-label="关闭">X</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="seed.js?v=20260813b"></script>
  <script src="app.js?v=20260823a"></script>
</body>
</html>
